}
function Guida() {
  const steps = [['Prima della stagione', 'Squadra, stagione e calendario CSI sono già inseriti. Completa la rosa con nome, nick, numero e ruolo, oppure importa il backup della vecchia app.'], ['Durante la settimana', 'Apri il Centro partita, segna le disponibilità, scegli i convocati (massimo 12) e prepara il quintetto. Genera il PDF e il testo per WhatsApp.'], ['A bordo campo', 'Apri Live partita: cronometro, cambi, gol, cartellini, falli e timeout. I compagni seguono il tabellone in tempo reale.'], ['Dopo il fischio finale', 'Conferma il referto: risultato e statistiche si aggiornano. Aggiorna classifica e risultati del girone dal portale CSI.'], ['Il lavoro con Davide', 'In Allenamenti usa Genera allenamento; nell’Area Davide salva schemi per la gara, usa il generatore di formazioni e registra le osservazioni.'], ['Rinvii', 'In Calendario modifica la gara, scegli Rinvio / recupero e indica la nuova data o “da definire”: gli allenamenti si sistemano da soli.']];
  return html`<article class="card"><div class="card-h"><span class="eyebrow">Come si usa</span><span class="small muted">Prima, durante e dopo ogni partita</span></div>
    <div class="grid g3">${steps.map(([t, d], i) => html`<div class="stack" style="gap:6px"><span class="pill fire" style="justify-self:start">${i + 1}</span><h4>${t}</h4><p class="small muted">${d}</p></div>`)}</div></article>`;
}
function Restore({ onClose }) {
  const [data, setData] = useState(null), [err, setErr] = useState(''), [busy, setBusy] = useState(false), [log, setLog] = useState('');
  const read = (file) => { if (!file) return; const fr = new FileReader(); fr.onload = () => { try { const j = JSON.parse(fr.result); setData(normalizeBackup(j)); setErr(''); } catch (e) { setErr('File non valido: ' + e.message); } }; fr.readAsText(file); };
  const go = async () => {
    setBusy(true);
    const cur = { quinto: 2, exportedAt: new Date().toISOString(), ...Object.fromEntries(COLLS_PUBLIC.concat(COLLS_STAFF).map((c) => [c, S[c]])) };
    await saveFile(`quinto-prima-del-ripristino-${todayISO()}.json`, JSON.stringify(cur));
    let n = 0;
    for (const [coll, docs] of Object.entries(data)) for (const [id, body] of Object.entries(docs)) { await put(coll, id, body); n++; if (n % 10 === 0) setLog(`${n} elementi scritti…`); }
    setBusy(false); toast(`Ripristino completato: ${n} elementi`); onClose();
  };
  return html`<${Modal} title="Ripristina un archivio" onClose=${onClose}>
    <p>Scegli un backup JSON esportato da QUINTO (nuova o vecchia versione). Gli elementi con lo stesso identificativo vengono sostituiti; prima del ripristino ti propongo di scaricare una copia dei dati attuali.</p>
    <input type="file" accept=".json,application/json" onChange=${(e) => read(e.target.files[0])}/>
    ${err && html`<div class="callout warn">${err}</div>`}
    ${data && html`<div class="tablewrap"><table><tbody>${Object.entries(data).map(([k, v]) => html`<tr><td>${k}</td><td class="num">${Object.keys(v).length}</td></tr>`)}</tbody></table></div><div class="row"><button class="btn fire" disabled=${busy} onClick=${go}>${busy ? 'Ripristino in corso…' : 'Ripristina'}</button><span class="small muted">${log}</span></div>`}
  </${Modal}>`;
}
/* converte backup vecchi (schema 8: {board:{...}}) e nuovi */
function normalizeBackup(j) {
  if (j.quinto === 2) { const o = {}; COLLS_PUBLIC.concat(COLLS_STAFF).forEach((c) => { if (j[c] && Object.keys(j[c]).length) o[c] = j[c]; }); return o; }
  const b = j.board || j.data || j;
  if (!b.matches && !b.players) throw new Error('non riconosco il formato');
  const o = { club: {}, matches: {}, training: {}, tactics: {}, players: {}, ratings: {}, notes: {}, observations: {}, staffmatches: {}, stafftraining: {} };
  if (b.profile) o.club.profile = { ...b.profile, trainingConfig: b.trainingConfig || profile().trainingConfig };
  if (b.standings?.length) o.club.standings = { rows: b.standings.map(({ id, ...r }) => r), checkedAt: b.standingsCheckedAt || todayISO() };
  (b.players || []).forEach((p) => {
    o.players[p.id] = { id: p.id, name: p.name || '', nick: p.nick || p.nickname || '', number: p.number ?? p.shirt ?? null, role: p.role || '', foot: p.foot || '', certExpiry: p.certificateExpiry || p.certExpiry || p.medicalExpiry || '', registered: !!(p.registered || p.registrationVerified || p.membershipVerified), active: p.active !== false && !p.archived,
      injury: { active: !!(p.injured || p.injury?.active), returnDate: p.injuryReturn || p.returnDate || p.injury?.returnDate || '', note: p.injuryNote || p.injury?.note || '' },
      suspension: { active: !!(p.suspended || p.suspension?.active), games: p.suspensionGames ?? p.suspension?.games ?? null, until: p.suspendedUntil || p.suspension?.until || '', ref: p.suspensionNote || p.suspension?.ref || '' }, notes: p.notes || '' };
  });
  (b.matches || []).forEach((m) => {
    const { roster, starters, mvp, notes, videoUrl, availability, ...pub } = m;
    if (pub.live && pub.live.finished) pub.live.started = true;
    o.matches[m.id] = pub;
    const rep = {}; const called = [];
    Object.entries(roster || {}).forEach(([pid, r]) => { if (r.called || r.convocato || r.status === 'called') called.push(pid); rep[pid] = { played: !!(r.played || r.inField), goals: +r.goals || 0, assists: +r.assists || 0, minutes: +r.minutes || 0, yellow: +(r.yellow || r.yellows) || 0, red: +(r.red || r.reds) || 0 }; });
    o.staffmatches[m.id] = { availability: availability || Object.fromEntries(Object.entries(roster || {}).map(([pid, r]) => [pid, r.availability || 'ask'])), called: called.slice(0, MAX_CALLED), starters: starters || [], formation: m.formation || '1-2-1', report: rep, mvp: mvp || '', notes: notes || '', videoUrl: videoUrl || '' };
  });
  (b.training || []).forEach((t) => { const { attendance, notes, ...pub } = t; o.training[t.id] = { ...pub, notes: '' }; if ((attendance && Object.keys(attendance).length) || notes) o.stafftraining[t.id] = { attendance: Object.fromEntries(Object.entries(attendance || {}).map(([k, v]) => [k, v === true || v === 'present' ? 'yes' : v === false || v === 'absent' ? 'no' : v])), diary: notes || '' }; });
  (b.tactics || []).forEach((t) => { o.tactics[t.id] = { ...t, tokens: (t.tokens || []).map((k) => ({ ...k, side: k.side === 'ours' ? (k.id === 'ours-0' ? 'gk' : 'a') : k.side === 'opponent' ? 'b' : k.side })) }; });
  (b.notes || []).forEach((n) => { o.notes[n.id] = { id: n.id, title: n.title || '', body: n.body || n.text || n.content || '', category: n.category || 'promemoria', due: n.due || n.dueDate || '', done: !!(n.done || n.completed) }; });
  (b.development?.profiles || []).forEach((r) => { o.ratings[r.id] = r; });
  (b.development?.observations || []).forEach((x) => { o.observations[x.id] = { ...x, context: x.kind || x.context || 'training' }; });
  Object.keys(o).forEach((k) => { if (!Object.keys(o[k]).length) delete o[k]; });
  return o;
}

/* ---------- INTRO ---------- */
function Intro({ onDone }) {
  const [play, setPlay] = useState(false), [p, setP] = useState(0);
  const a = useRef();
  let skip = false; try { skip = localStorage.getItem('quinto-intro') === 'no'; } catch (e) {}
  const [no, setNo] = useState(skip);
  const enter = () => { try { localStorage.setItem('quinto-intro', no ? 'no' : 'yes'); } catch (e) {} onDone(); };
  const start = () => { setPlay(true); const au = a.current; if (au) { au.currentTime = 0; au.play().catch(() => {}); } };
  useEffect(() => { if (!play) return; const t0 = Date.now(); const h = setInterval(() => { const x = (Date.now() - t0) / 12000; setP(Math.min(1, x)); if (x >= 1) { clearInterval(h); setTimeout(enter, 400); } }, 100); return () => clearInterval(h); }, [play]);
  return html`<div class=${'intro' + (play ? ' play' : '')} role="dialog" aria-label="Intro Polisportiva Tigers">
    <${Stripes} seed=${3} count=${18} alpha=${.07}/>
    <div class="row between"><div class="brand" style="font-size:30px">QUINT<span class="o"><img src="tigers-stemma.png" alt=""/></span></div><button class="btn line sm" style="color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)" onClick=${() => { a.current && a.current.pause(); enter(); }}>Salta intro <${Icon} n="x"/></button></div>
    <div class="intro-c">
      <div class="disc"><img src="tigers-stemma.png" alt="Stemma Polisportiva Tigers"/></div>
      <span class="tag">Cinque in campo · tutti dalla stessa parte</span>
      <h1><span>Forza</span><em>Tigers.</em></h1>
      ${play ? html`<div class="intro-progress" aria-hidden="true"><i style=${'width:' + p * 100 + '%'}></i></div><button class="btn ghost" style="color:#fff" onClick=${() => { if (a.current) a.current.muted = !a.current.muted; }}><${Icon} n="music"/>Audio sì / no</button>`
      : html`<div class="row" style="justify-content:center"><button class="btn fire" style="padding:14px 22px;font-size:17px" onClick=${start}><${Icon} n="play"/>Entra con l’inno</button><button class="btn ghost" style="color:#fff" onClick=${enter}>Entra subito <${Icon} n="arrowR"/></button></div>`}
    </div>
    <div class="row between small" style="color:#AEB3D6"><label class="check"><input type="checkbox" checked=${no} onChange=${(e) => setNo(e.target.checked)}/>Non mostrare all’apertura</label><span>Polisportiva Tigers · Futsal</span></div>
    <audio ref=${a} src="forza-tigers-intro.mp3" preload="auto"></audio>
  </div>`;
}

/* ---------- SHELL ---------- */
const ROUTES = [
  ['home', 'Panoramica', 'home', Home, 'Squadra'], ['squadra', 'La squadra', 'team', Squadra, 'Squadra'], ['calendario', 'Calendario', 'cal', Calendario, 'Partite'],
  ['partita', 'Centro partita', 'whistle', CentroPartita, 'Partite'], ['live', 'Live partita', 'live', Live, 'Partite'], ['statistiche', 'Statistiche', 'chart', Statistiche, 'Partite'],
  ['classifica', 'Classifica', 'trophy', Classifica, 'Campionato'], ['campionato', 'Campionato CSI', 'ball', Campionato, 'Campionato'], ['avversari', 'Avversari', 'target', Avversari, 'Campionato'],
  ['allenamenti', 'Allenamenti', 'cone', Allenamenti, 'Allenamento'], ['davide', 'Area Davide', 'board', Davide, 'Allenamento'], ['taccuino', 'Taccuino', 'note', Taccuino, 'Allenamento'],
  ['impostazioni', 'Impostazioni', 'gear', Impostazioni, 'Altro'],
];
function parseHash() { const h = decodeURIComponent((location.hash || '').slice(1)); const [r, ...rest] = h.split('~'); return { route: ROUTES.some((x) => x[0] === r) ? r : 'home', arg: rest.join('~') || '' }; }
function App() {
  const s = useStore();
  const [loc, setLoc] = useState(parseHash());
  const [menu, setMenu] = useState(false);
  const [loginOpen, setLoginOpen] = useState(false);
  useEffect(() => { window.__login = () => { setMenu(false); setLoginOpen(true); }; }, []);
  let introPref = 'yes'; try { introPref = localStorage.getItem('quinto-intro') || 'yes'; } catch (e) {}
  const [intro, setIntro] = useState(() => { try { return introPref !== 'no' && !sessionStorage.getItem('quinto-intro-seen'); } catch (e) { return introPref !== 'no'; } });
  useEffect(() => { window.__showIntro = () => setIntro(true); const f = () => { setLoc(parseHash()); setMenu(false); scrollTo(0, 0); }; addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const go = (route, arg) => { const h = '#' + route + (arg ? '~' + encodeURIComponent(arg) : ''); if (location.hash === h) { setLoc(parseHash()); } else location.hash = h; };
  const R = ROUTES.find((r) => r[0] === loc.route);
  const View = R[3];
  const live = matchList().find((m) => m.live && m.live.started && !m.live.finished);
  let groups = []; ROUTES.forEach((r) => { if (!groups.length || groups[groups.length - 1][0] !== r[4]) groups.push([r[4], []]); groups[groups.length - 1][1].push(r); });
  return html`<div class="shell">
    <aside class=${'side' + (menu ? ' open' : '')} aria-label="Navigazione principale">
      <button class="iconbtn close-side" aria-label="Chiudi menu" onClick=${() => setMenu(false)}><${Icon} n="x"/></button>
      <a class="brand" href="#home">QUINT<span class="o"><img src="tigers-stemma.png" alt=""/></span></a>
      <div class="brand-sub">Polisportiva Tigers</div>
      <nav class="nav">${groups.map(([g, rs]) => html`<div class="nav-group">${g}</div>${rs.map((r) => html`<a href=${'#' + r[0]} class=${loc.route === r[0] ? 'on' : ''} aria-current=${loc.route === r[0] ? 'page' : null}><${Icon} n=${r[2]}/>${r[1]}${r[0] === 'live' && live ? html`<span class="badge">ON</span>` : ''}</a>`)}`)}</nav>
      <div class="side-foot">
        ${s.loggedIn ? html`<div class="who"><${Icon} n="user"/>MISTER · staff</div>` : ''}
        <span>${s.canWrite ? 'Modifica attiva' : s.loggedIn ? 'Accesso staff senza permessi di salvataggio' : 'Consultazione libera'}${s.stale ? ' · dati forse non aggiornati' : ''}</span>
        ${s.loggedIn ? html`<button class="btn line sm" style="color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);justify-self:start" onClick=${() => { logout(); toast('Sei uscito: ora consulti come tutti'); }}>Esci</button>`
          : html`<button class="btn fire sm" style="justify-self:start" onClick=${() => { setMenu(false); setLoginOpen(true); }}><${Icon} n="lock"/>Accesso staff</button>`}
        <span>Cinque in campo, tutti dalla stessa parte.</span>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="mtop"><a class="brand" href="#home">QUINT<span class="o"><img src="tigers-stemma.png" alt=""/></span></a><button class="iconbtn" aria-label="Apri menu" onClick=${() => setMenu(true)}><${Icon} n="menu"/></button></div>
      ${s.canWrite && s.canPublish && (s.pubDirty > 0 || s.publishing) && html`<div class="page" style="margin-bottom:16px"><${PublishBar}/></div>`}
      ${s.phase === 'loading' ? html`<div class="page"><p class="muted">Apro lo spogliatoio…</p></div>` : html`<${View} go=${go} arg=${loc.arg} key=${loc.route}/>`}
      ${s.error && html`<div class="page" style="margin-top:16px"><div class="callout warn"><${Icon} n="info"/>${s.error}</div></div>`}
    </main>
    <nav class="mbar" aria-label="Sezioni principali">
      ${[['home', 'Home', 'home'], ['calendario', 'Gare', 'cal'], ['live', 'Live', 'live'], ['allenamenti', 'Allenam.', 'cone']].map(([r, l, i]) => html`<a href=${'#' + r} class=${loc.route === r ? 'on' : ''}><${Icon} n=${i}/>${l}</a>`)}
      <button onClick=${() => setMenu(true)}><${Icon} n="menu"/>Menu</button>
    </nav>
    ${loginOpen && html`<${LoginModal} onClose=${() => setLoginOpen(false)}/>`}

    <${Toaster}/>
  </div>`;
