<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1257">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QUINTO">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>QUINTO · Polisportiva Tigers</title>
<meta name="description" content="Lo spogliatoio digitale della Polisportiva Tigers: calendario CSI, convocazioni, live, allenamenti e area tecnica.">
<link rel="icon" href="tigers-stemma.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="app-css">/* Layout: spogliatoio a due zone — barra laterale blu (navigazione) + campo chiaro; su telefono barra in basso e menu a tutta pagina. */
:root{
  --blu:#0B1257; --notte:#060A33; --fiamma:#F04E23; --gesso:#FFFFFF;
  --vittoria:#1E9E66; --pari:#8A90AE; --sconfitta:#C42840; --giallo:#F5C518;
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#EEF0F8; --fg:#0B1257; --text:#1B2150; --muted:#5B6286; --line:#DCDFEE;
  --accent:#F04E23; --accent-ink:#C63A12; --accent-soft:rgba(240,78,35,.12);
  --side:#0B1257; --side-fg:#FFFFFF; --side-muted:#9EA4CC; --side-line:#1C2468;
  --ok-soft:rgba(30,158,102,.13); --bad-soft:rgba(196,40,64,.12); --warn-soft:rgba(245,197,24,.22); --warn-ink:#7A5D00;
  --shadow:0 1px 0 rgba(11,18,87,.04),0 12px 30px -22px rgba(11,18,87,.45);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Barlow Condensed","Arial Narrow",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060A33; --surface:#0D1450; --surface-2:#141C5E; --fg:#F3F4FB; --text:#DDE0F2; --muted:#A1A7CE; --line:#232C70;
  --accent:#FF6339; --accent-ink:#FF8A66; --accent-soft:rgba(255,99,57,.16);
  --side:#040727; --side-fg:#FFFFFF; --side-muted:#8F96C4; --side-line:#141B57;
  --ok-soft:rgba(46,190,128,.16); --bad-soft:rgba(240,80,100,.16); --warn-soft:rgba(245,197,24,.16); --warn-ink:#F5C518;
  --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060A33; --surface:#0D1450; --surface-2:#141C5E; --fg:#F3F4FB; --text:#DDE0F2; --muted:#A1A7CE; --line:#232C70;
  --accent:#FF6339; --accent-ink:#FF8A66; --accent-soft:rgba(255,99,57,.16);
  --side:#040727; --side-fg:#FFFFFF; --side-muted:#8F96C4; --side-line:#141B57;
  --ok-soft:rgba(46,190,128,.16); --bad-soft:rgba(240,80,100,.16); --warn-soft:rgba(245,197,24,.16); --warn-ink:#F5C518;
  --shadow:0 0 0 1px rgba(255,255,255,.02); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
h1,h2,h3,h4{font-family:var(--f-display);text-transform:uppercase;color:var(--fg);margin:0;line-height:.95;text-wrap:balance;font-weight:800}
h1{font-size:clamp(40px,6vw,64px);font-weight:900}
h2{font-size:28px}
h3{font-size:21px}
h4{font-size:17px}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.tab{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column;padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:2px;font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;color:#fff;text-decoration:none;padding:4px 8px 2px}
.brand .o{width:.76em;height:.76em;border-radius:50%;background:#fff;display:grid;place-items:center;margin-left:2px}
.brand .o img{width:94%}
.brand-sub{font-family:var(--f-data);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 18px}
.nav{display:grid;gap:2px}
.nav-group{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;color:#D6D9F0;text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:15px}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--fiamma);color:#fff}
.nav a.on svg{opacity:1}
.nav a .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;font-family:var(--f-data);font-size:12px;padding:0 7px}
.side-foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--side-line);display:grid;gap:8px;font-size:13px;color:var(--side-muted)}
.side-foot .who{display:flex;align-items:center;gap:8px;color:#fff}
.side-foot .who img{width:26px;height:26px;border-radius:50%}
.main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1160px;margin:0 auto;display:grid;gap:22px}
.mbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0;z-index:70;height:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .main{padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex!important}
  .mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--side);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-top:1px solid var(--side-line)}
  .mbar a,.mbar button{display:grid;justify-items:center;gap:2px;color:#C9CCE6;text-decoration:none;font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:6px 2px;border-radius:8px;cursor:pointer}
  .mbar svg{width:20px;height:20px}
  .mbar .on{color:#fff;background:rgba(240,78,35,.9)}
}
.mtop{display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 6px;max-width:1160px}
.mtop .brand{color:var(--fg);font-size:28px;padding:0}
.mtop .brand .o{box-shadow:inset 0 0 0 2px var(--fg)}
.iconbtn.close-side{display:none}
@media (max-width:900px){.iconbtn.close-side{display:inline-grid;position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px))}}

/* page head */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding-bottom:4px}
.phead>div{display:grid;gap:8px;min-width:0}
.eyebrow{font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:10px}
.graffi{display:inline-flex;gap:3px;transform:skewX(-18deg)}
.graffi i{display:block;width:4px;height:14px;background:var(--fiamma);border-radius:1px 4px 1px 4px}
.graffi i:nth-child(2){height:17px;margin-top:-2px}.graffi i:nth-child(3){height:12px;margin-top:1px}
.lead{color:var(--muted);max-width:64ch}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.dark{background:var(--blu);border-color:var(--blu);color:#fff}
.card.dark h2,.card.dark h3,.card.dark h4{color:#fff}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h .eyebrow{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-7-5{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stack{display:grid;gap:12px;align-content:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty h3{font-size:20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--f-data);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase;padding:9px 15px;border-radius:9px;border:0;cursor:pointer;text-decoration:none;line-height:1.1;white-space:nowrap;background:var(--surface-2);color:var(--fg)}
.btn svg{width:16px;height:16px}
.btn:hover{filter:brightness(.97)}
.btn.fire{background:var(--fiamma);color:#fff}
.btn.blue{background:var(--blu);color:#fff}
:root[data-theme="dark"] .btn.blue{background:#26318A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.blue{background:#26318A}}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:transparent;padding-inline:8px}
.btn.danger{background:var(--bad-soft);color:var(--sconfitta)}
.btn.sm{font-size:13px;padding:6px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:0;background:var(--surface-2);color:var(--fg);cursor:pointer}
.iconbtn svg{width:18px;height:18px}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--vittoria)}
.pill.bad{background:var(--bad-soft);color:var(--sconfitta)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.fire{background:var(--accent-soft);color:var(--accent-ink)}
.pill.blue{background:var(--blu);color:#fff}
.res{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-family:var(--f-data);font-weight:700;font-size:14px}
.res.V{background:var(--ok-soft);color:var(--vittoria)}.res.N{background:var(--surface-2);color:var(--muted)}.res.P{background:var(--bad-soft);color:var(--sconfitta)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:var(--f-data);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(11,18,87,.15)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-family:var(--f-data);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--fiamma)}

/* forms */
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted);font-size:12px}
input,select,textarea{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:15px}
textarea{resize:vertical;min-height:70px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--fiamma);flex:none;padding:0}
input[type=range]{accent-color:var(--fiamma);padding:0;border:0}
input:focus,select:focus,textarea:focus{border-color:var(--fiamma);outline:none}
.check{display:flex;align-items:center;gap:9px;cursor:pointer}
.search{position:relative;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{padding-left:32px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar>*{min-width:0}
.toolbar .search{flex:1 1 220px}
.toolbar select{width:auto;flex:0 1 auto}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-data);font-size:16px}
tr.us td{background:var(--accent-soft);font-weight:700}
.pos{font-family:var(--f-display);font-weight:900;font-size:20px;width:34px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,10,51,.6);z-index:80;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:min(720px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);display:flex;flex-direction:column}
.modal.wide{width:min(1000px,100%)}
.modal-h{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px;display:grid;gap:16px}
.modal-f{position:sticky;bottom:0;background:var(--surface);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.confirm{background:var(--warn-soft);border-radius:10px;padding:12px;display:grid;gap:10px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--notte);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast.err{background:var(--sconfitta)}
@media (min-width:901px){.toast{bottom:24px}}

/* home */
.hero{background:var(--blu);color:#fff;border-radius:18px;position:relative;overflow:hidden;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*{position:relative}
.hero h1{color:#fff;font-size:clamp(46px,7vw,86px)}
.hero h1 em{font-style:normal;color:var(--fiamma)}
.hero .eyebrow{color:#FF8A66}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat b{display:block;font-family:var(--f-data);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.hstat span{font-family:var(--f-data);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#AEB3D6}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:20px}.hstat b{font-size:36px}}

.match{display:grid;gap:14px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;text-align:center}
.team{display:grid;justify-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.crest{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.crest img{width:92%}
.crest.opp{background:var(--surface-2);font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--fg)}
.crest.sm{width:34px;height:34px;font-size:16px;border-width:1.5px}
.when{font-family:var(--f-data);text-align:center}
.when b{display:block;font-size:36px;font-weight:700;line-height:1;color:var(--fg)}
.when small{color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.bigscore{font-family:var(--f-data);font-weight:700;font-size:64px;line-height:.9;color:var(--fg);font-variant-numeric:tabular-nums}
.place{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:14px}
.place svg{width:16px;height:16px;flex:none;margin-top:2px}

/* list rows */
.list{display:grid}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.btnrow{cursor:pointer;border-radius:8px;padding-inline:8px}
.lrow.btnrow:hover{background:var(--surface-2)}
.date-tile{width:52px;text-align:center;border-radius:9px;background:var(--surface-2);padding:5px 0;font-family:var(--f-data);line-height:1}
.date-tile b{display:block;font-size:22px;color:var(--fg)}
.date-tile small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.date-tile.match{background:var(--blu)} .date-tile.match b,.date-tile.match small{color:#fff}
.date-tile.tbd{background:var(--warn-soft)}
.ttl{font-weight:700;color:var(--fg);overflow-wrap:anywhere}

/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;display:grid;gap:10px;box-shadow:var(--shadow)}
.pcard .num{position:absolute;right:-4px;top:-16px;font-family:var(--f-display);font-weight:900;font-size:110px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--line);pointer-events:none}
.pcard .nick{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:.9;text-transform:uppercase;color:var(--fg);position:relative;overflow-wrap:anywhere}
.pcard .name{color:var(--muted);font-size:14px;position:relative}
.pcard>*{position:relative}
.pstats{display:flex;gap:16px}
.pstats div{display:grid}
.pstats b{font-family:var(--f-data);font-size:24px;line-height:1;color:var(--fg)}
.pstats small{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 22px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--fiamma);border-radius:4px}
.bar .tr i.b{background:var(--blu)}
:root[data-theme="dark"] .bar .tr i.b{background:#8C95E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .tr i.b{background:#8C95E8}}
.bar b{font-family:var(--f-data);text-align:right}

/* centro partita */
.avail{display:grid;gap:0}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .who{display:flex;gap:10px;align-items:center;min-width:0}
.shirt{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--blu);color:#fff;font-family:var(--f-data);font-weight:700;font-size:15px;flex:none}
.shirt.gk{background:var(--fiamma)}
.counter{font-family:var(--f-data);font-weight:700;font-size:40px;line-height:1;color:var(--fg)}
.counter.full{color:var(--accent-ink)}

/* pitch */
.pitch{position:relative;width:100%;aspect-ratio:2/1;max-width:100%;border-radius:12px;background:#1D6B4E;overflow:hidden;touch-action:none;user-select:none}
.pitch.v{aspect-ratio:3/4}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.token{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-weight:700;font-size:13px;color:#fff;border:2px solid #fff;cursor:grab;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1;text-align:center;overflow:hidden;padding:2px}
.token.a{background:var(--fiamma)} .token.b{background:var(--blu)} .token.gk{background:#F5C518;color:#0B1257}
.token.ball{width:20px;height:20px;background:#fff;border-color:#0B1257;cursor:grab}
.token.sel{outline:3px solid #fff;outline-offset:2px}
.token-name{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}

/* live */
.board{background:var(--notte);color:#fff;border-radius:18px;padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.board canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board>*:not(canvas){position:relative}
.board .sc{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;text-align:center}
.board .n{font-family:var(--f-data);font-weight:700;font-size:clamp(64px,12vw,110px);line-height:.9;font-variant-numeric:tabular-nums}
.board .t{font-family:var(--f-display);font-weight:800;font-size:clamp(16px,2.6vw,24px);text-transform:uppercase;color:#AEB3D6;overflow-wrap:anywhere}
.clock{font-family:var(--f-data);font-weight:700;font-size:clamp(34px,6vw,54px);padding:6px 16px;border-radius:12px;background:rgba(240,78,35,.16);color:#FF8A66;font-variant-numeric:tabular-nums;line-height:1}
.clock.run{background:var(--fiamma);color:#fff}
.period{font-family:var(--f-data);letter-spacing:.16em;text-transform:uppercase;color:#AEB3D6;font-size:13px}
.fouls{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-data);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#AEB3D6;flex-wrap:wrap}
.pips{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.pips i{width:11px;height:11px;border-radius:2px;background:#232B6B}.pips i.on{background:var(--fiamma)}.pips i.over{background:var(--sconfitta)}
.liveact{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.liveact .btn{padding:14px 10px;font-size:15px}
.feed{display:grid}
.ev{display:grid;grid-template-columns:62px 22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev time{font-family:var(--f-data);font-weight:700;color:var(--accent-ink)}
.card-y{display:inline-block;width:11px;height:15px;border-radius:2px;background:var(--giallo)}
.card-r{display:inline-block;width:11px;height:15px;border-radius:2px;background:var(--sconfitta)}
.onfield{display:flex;flex-wrap:wrap;gap:6px}
.onfield .pill{font-size:13px}

/* diagram */
.diagram{width:100%;max-width:100%;border-radius:10px;display:block}
.drill{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.drill>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.drill>summary::-webkit-details-marker{display:none}
.drill[open]>summary{border-bottom:1px solid var(--line)}
.mins{font-family:var(--f-data);font-weight:700;font-size:20px;color:var(--fg);min-width:44px;text-align:center;background:var(--surface-2);border-radius:8px;padding:2px 6px}
.drill-b{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.drill-b{grid-template-columns:1fr}}
.drill-b ol{margin:0;padding-left:20px;display:grid;gap:4px}
.kv{display:grid;gap:3px}
.kv>span{font-family:var(--f-data);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.timeline{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.timeline span{display:block;min-width:4px}

/* intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--notte);color:#fff;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro>*{position:relative}
.intro-c{display:grid;place-items:center;align-content:center;gap:18px;text-align:center}
.intro .disc{width:clamp(110px,22vw,170px);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 0 0 22px rgba(240,78,35,.2)}
.intro .disc img{width:92%}
.intro h1{color:#fff;font-size:clamp(64px,15vw,190px);line-height:.85}
.intro h1 em{font-style:normal;color:var(--fiamma);display:block}
.intro .tag{font-family:var(--f-data);letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:#AEB3D6}
.intro-progress{height:4px;width:min(320px,70vw);background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.intro-progress i{display:block;height:100%;background:var(--fiamma);width:0}
@media (prefers-reduced-motion:no-preference){
  .intro.play .disc{animation:pop .8s cubic-bezier(.2,.9,.2,1.2) both}
  .intro.play h1 span{display:inline-block;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .intro.play h1 em{animation:rise .7s .35s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pop{from{transform:scale(.4) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes rise{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
}

/* misc */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi b{font-family:var(--f-data);font-weight:700;font-size:34px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--f-data);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-data);font-size:12px}
.note-line{border-left:3px solid var(--fiamma);padding:6px 0 6px 12px;color:var(--text)}
.callout{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.callout svg{width:18px;height:18px;flex:none;color:var(--accent-ink);margin-top:1px}
.callout.warn{background:var(--warn-soft)}
.copybox{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:14px;font-size:14px;max-height:320px;overflow:auto;border:0;width:100%;min-height:200px}
.audio{width:100%}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.readonly-banner{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted)}
.readonly-banner svg{width:18px;height:18px;flex:none}

/* ---------- trailer della partita ---------- */
.trailer{position:fixed;inset:0;z-index:150;background:#060A33;color:#fff;overflow:hidden;--pulse:0;--tension:0;--prog:0;font-family:var(--f-body)}
.tr-bg{position:absolute;inset:0;opacity:calc(.5 + var(--tension)*.5)}
.tr-bg canvas{position:absolute;inset:0;width:100%;height:100%}
.trailer::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 45%,rgba(240,78,35,calc(.12 + var(--tension)*.25 + var(--pulse)*.3)),transparent 55%);pointer-events:none}
.tr-flash{position:absolute;inset:0;background:#fff;opacity:calc(var(--pulse)*.16);pointer-events:none}
.tr-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.tr-close svg{width:22px;height:22px}
.tr-stage{position:absolute;inset:0}
.tr-center{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(8px,2vh,18px);text-align:center;padding:24px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px))}
.tr-kicker{font-family:var(--f-data);font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(13px,2.2vw,18px);color:#FF8A66}
.tr-sub{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,54px);text-transform:uppercase;color:#AEB3D6}
.tr-vs{font-family:var(--f-data);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(16px,3vw,24px)}
.tr-h,.tr-opp,.tr-mega,.tr-section,.tr-chant{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.86;margin:0;color:#fff}
.tr-h{font-size:clamp(48px,11vw,120px)} .tr-h em{font-style:normal;color:var(--fiamma)}
.tr-opp{font-size:clamp(44px,11vw,130px)}
.tr-mega{font-size:clamp(84px,24vw,280px);letter-spacing:-.01em}
.tr-mega.outline{color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55);margin-top:-.25em}
.tr-section{font-size:clamp(56px,15vw,190px);color:transparent;-webkit-text-stroke:2px #fff}
.tr-chant{font-size:clamp(56px,14vw,150px);color:var(--fiamma)}
.tr-disc{width:clamp(110px,24vw,190px);aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 12px rgba(255,255,255,.06),0 0 calc(30px + var(--pulse)*60px) rgba(240,78,35,.6)}
.tr-disc img{width:92%}
.tr-disc.big{width:clamp(130px,28vw,230px)}
.tr-start .tr-play{padding:15px 24px;font-size:18px}
.tr-err{color:#FF8A66;font-size:18px}
/* persona */
.tr-person{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:2vw;padding:0 max(24px,4vw)}
.tr-num{font-family:var(--f-display);font-weight:900;font-size:clamp(150px,36vw,460px);line-height:.8;color:transparent;-webkit-text-stroke:3px var(--fiamma);text-align:right;text-shadow:0 0 60px rgba(240,78,35,.35)}
.tr-num.coach{font-size:clamp(70px,14vw,170px);-webkit-text-stroke:2px #fff}
.tr-who{display:grid;gap:6px;justify-items:start;min-width:0}
.tr-role{font-family:var(--f-data);font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(12px,2vw,17px);color:#AEB3D6;border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px}
.tr-first{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,70px);text-transform:uppercase;line-height:.9;color:#D6D9F0}
.tr-last{font-family:var(--f-display);font-weight:900;font-size:clamp(52px,11vw,140px);text-transform:uppercase;line-height:.84;overflow-wrap:anywhere}
.tr-nick{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:900;font-size:clamp(38px,8vw,96px);text-transform:uppercase;color:#fff;background:var(--fiamma);padding:4px 18px 2px;transform:skewX(-8deg);margin-top:8px}
.tr-nick .graffi i{background:#fff}
.tr-count{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));font-family:var(--f-data);font-weight:700;letter-spacing:.2em;color:#AEB3D6;font-size:14px}
@media (max-width:700px) and (orientation:portrait){
  .tr-person{grid-template-columns:1fr;align-content:center;justify-items:center;text-align:center;gap:0}
  .tr-num{text-align:center;font-size:clamp(150px,52vw,300px)}
  .tr-who{justify-items:center}
}
/* costruzione e drop */
.tr-ring{position:relative;width:min(84vw,84vh);aspect-ratio:1;display:grid;place-items:center}
.tr-ring-n{position:absolute;inset:0;animation:trspin 2.4s linear infinite}
.tr-ring span{position:absolute;left:50%;top:50%;width:2.4em;margin:-.6em 0 0 -1.2em;text-align:center;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,5vw,44px);line-height:1.2;color:#fff;transform:rotate(var(--a)) translateY(calc(-1 * min(36vw,36vh))) rotate(calc(-1 * var(--a)));text-shadow:0 0 18px rgba(240,78,35,.8);animation:trfade .6s both}
@keyframes trfade{from{opacity:0}to{opacity:1}}
.tr-marquee{width:100vw;overflow:hidden;border-block:2px solid rgba(255,255,255,.2);padding:10px 0;margin-top:2vh}
.tr-marquee div{display:flex;gap:34px;width:max-content;animation:trmarq 9s linear infinite}
.tr-marquee span{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,5vw,52px);text-transform:uppercase;white-space:nowrap}
.tr-marquee b{color:var(--fiamma);margin-right:10px}
.tr-beat{transform:scale(calc(1 + var(--pulse)*.06))}
.tr-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1)}
.tr-bar i{display:block;height:100%;width:calc(var(--prog)*100%);background:var(--fiamma)}
/* animazioni d'ingresso */
@media (prefers-reduced-motion:no-preference){
  .tr-in{animation:trin .5s cubic-bezier(.2,.8,.2,1) both}
  .tr-slam{animation:trslam .45s cubic-bezier(.2,1.4,.3,1) both}
  .tr-pop{animation:trpop .4s cubic-bezier(.2,1.6,.3,1) both}
  .tr-wipe{animation:trwipe .6s cubic-bezier(.7,0,.2,1) both}
  .tr-shake{animation:trslam .45s cubic-bezier(.2,1.4,.3,1) both,trshake .35s .3s both}
  .tr-spin{animation:trspinin .9s cubic-bezier(.2,.9,.2,1.2) both}
  .trailer .tr-person .tr-num{animation:trnum .55s cubic-bezier(.2,1.3,.3,1) both}
}
@keyframes trin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes trslam{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:none}}
@keyframes trpop{from{opacity:0;transform:skewX(-8deg) scale(.3)}to{opacity:1;transform:skewX(-8deg)}}
@keyframes trwipe{from{clip-path:inset(0 100% 0 0);transform:translateX(-6%)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes trshake{0%,100%{translate:0 0}20%{translate:-8px 4px}40%{translate:7px -5px}60%{translate:-5px 3px}80%{translate:4px -2px}}
@keyframes trspinin{from{opacity:0;transform:scale(.3) rotate(-120deg)}to{opacity:1;transform:none}}
@keyframes trnum{from{opacity:0;transform:translateX(-30%) scale(1.6)}to{opacity:1;transform:none}}
@keyframes trspin{to{transform:rotate(360deg)}}
@keyframes trmarq{to{transform:translateX(-50%)}}
/* drop rinnovato */
.trailer.dropping .tr-flash{background:var(--fiamma);opacity:calc(var(--bar)*.55 + var(--pulse)*.08)}
.trailer.dropping .tr-bg{transform:translateY(calc(var(--pulse)*-14px)) scale(calc(1.04 + var(--pulse)*.03))}
.tr-mega.outline.solo{margin-top:0}
.tr-wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(92vw,980px)}
@media (min-width:760px){.tr-wall{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tr-tile{border:2px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 6px;display:grid;justify-items:center;gap:2px;opacity:.12;transform:scale(.85);transition:opacity .12s,transform .25s cubic-bezier(.2,1.6,.3,1),background .2s}
.tr-tile.on{opacity:1;transform:none;background:rgba(240,78,35,.18);border-color:var(--fiamma)}
.tr-tile b{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,8vw,64px);line-height:.9;color:#fff}
.tr-tile span{font-family:var(--f-data);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:clamp(12px,2.4vw,18px);color:#FF8A66}
.tr-strobe{position:absolute;inset:0;display:grid;place-items:center;background:var(--blu);overflow:hidden}
.tr-strobe.alt{background:var(--fiamma)}
.tr-strobe-num{position:absolute;font-family:var(--f-display);font-weight:900;font-size:min(95vw,95vh);line-height:.8;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.22);transform:scale(calc(1 + var(--pulse)*.05))}
.tr-strobe-txt{position:relative;display:grid;justify-items:center;text-align:center;gap:6px;padding:0 16px}
.tr-strobe-nick{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(70px,20vw,240px);line-height:.85;margin:0;color:#fff;transform:skewX(-8deg)}
.tr-strobe.alt .tr-strobe-nick{color:var(--blu)}
.tr-strobe.alt .tr-first{color:#fff}
.tr-versus{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto 1fr}
.tr-vs-side{display:grid;align-content:center;gap:6px;padding:0 max(22px,5vw)}
.tr-vs-side h2{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(54px,14vw,170px);line-height:.85;margin:0;color:#fff;overflow-wrap:anywhere}
.tr-vs-side.l{background:linear-gradient(180deg,transparent,rgba(255,255,255,.04));animation:trleft .5s cubic-bezier(.2,.9,.2,1) both}
.tr-vs-side.r{text-align:right;justify-items:end;background:linear-gradient(0deg,transparent,rgba(240,78,35,.18));animation:trright .5s cubic-bezier(.2,.9,.2,1) both}
.tr-vs-side.r h2{color:var(--fiamma)}
.tr-vs-x{justify-self:center;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,10vw,110px);color:#060A33;background:#fff;padding:2px 22px;transform:skewX(-10deg) scale(calc(1 + var(--pulse)*.12))}
.tr-word{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(64px,16vw,200px);line-height:.88;margin:0;color:#fff;padding:0 12px}
.tr-word.hot{color:var(--fiamma)}
.tr-burst{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(from 0deg,rgba(240,78,35,.16) 0 6deg,transparent 6deg 18deg);animation:trspin 14s linear infinite;pointer-events:none}
@keyframes trleft{from{transform:translateX(-100%)}to{transform:none}}
@keyframes trright{from{transform:translateX(100%)}to{transform:none}}

/* ascolta in tempo reale un insieme di raccolte; restituisce le funzioni per smettere */
function subscribe(names) {
  const pending = new Set(names);
  const timer = setTimeout(() => { if (pending.size) { S.stale = true; S.phase = 'ready'; bump(); } }, 10000);
  return names.map((name) => DB.collection(name).onSnapshot((snap) => {
    const obj = {};
    snap.docs.forEach((d) => { obj[d.id] = d.data(); });
    // archivio ancora vuoto: si continua a mostrare la copia pubblica di partenza
    if (!snap.docs.length && ['club', 'matches', 'training'].includes(name)) { /* resta PUB */ }
    else S[name] = obj;
    if (!snap.metadata.fromCache) { pending.delete(name); S.stale = false; }
    if (!pending.size) { clearTimeout(timer); S.phase = 'ready'; }
    bump();
  }, (e) => {
    pending.delete(name);
    if (e.code === 'revoked') { S.platformWrite = false; refreshRights(); }
    if (e.code !== 'permission-denied') S.error = 'Archivio non raggiungibile: ' + (e.message || e.code);
    S.phase = 'ready'; bump();
  }));
}
/* primo accesso su Firebase: carica i dati della stagione se l'archivio è vuoto */
async function seedIfEmpty() {
  const snap = await DB.doc('club/profile').get();
  if (snap.exists) return;
  const docs = [];
  Object.entries(PUB.club || {}).forEach(([id, d]) => docs.push(['club', id, d]));
  ['matches', 'training', 'tactics'].forEach((c) => Object.entries(PUB[c] || {}).forEach(([id, d]) => docs.push([c, id, d])));
  for (let i = 0; i < docs.length; i += 400) {
    const b = DB.batch();
    docs.slice(i, i + 400).forEach(([c, id, d]) => b.set(DB.doc(c + '/' + id), JSON.parse(JSON.stringify(d))));
    await b.commit();
  }
  toast('Dati della stagione caricati nell’archivio');
}

    if (!u && staffSubs) { staffSubs.forEach((f) => f()); staffSubs = null; COLLS_STAFF.forEach((c) => { S[c] = {}; }); bump(); }
  });
}

async function boot() {
  loadSnapshot();
  loadCsi();
  // si mostra subito: dati incorporati o già salvati sul telefono; l'archivio aggiorna in tempo reale appena risponde
  S.phase = 'ready'; bump();
  if (IS_FB) { try { await bootFirebase(); } catch (e) { S.phase = 'ready'; S.mode = 'snapshot'; S.error = 'Archivio non raggiungibile: ' + e.message; refreshRights(); } return; }
  S.loggedIn = storedLogin();
  const c = window.claude;
  if (!c || !c.use) { S.phase = 'ready'; S.mode = 'snapshot'; refreshRights(); return; }
  try {
    const [db, user, art] = await Promise.all([c.use('db'), c.use('user'), c.use('artifact')]);
    DB = db; USER = user; ART = art;
    if (user) {
      const me = await user.me();
      S.me = me; S.isOwner = !!me.isOwner; S.platformWrite = !!(await user.canEdit());
    }
    S.canPublish = !!art && S.platformWrite;
    if (!db) { S.phase = 'ready'; S.mode = 'snapshot'; refreshRights(); return; }
    S.mode = 'live'; refreshRights();
    const want = S.platformWrite ? COLLS_PUBLIC.concat(COLLS_STAFF) : COLLS_PUBLIC;
    let pending = new Set(want);
    const fresh = {};
    const timer = setTimeout(() => { S.stale = true; S.phase = 'ready'; bump(); }, 10000);
    want.forEach((name) => {
      db.collection(name).onSnapshot((snap) => {
        const obj = {};
        snap.docs.forEach((d) => { obj[d.id] = d.data(); });
        if (name === 'club') {
          S.club = Object.keys(obj).length ? obj : (fresh.club ? obj : S.club);
        } else S[name] = obj;
        if (!snap.metadata.fromCache) { fresh[name] = true; pending.delete(name); }
        if (pending.size === 0) { clearTimeout(timer); S.stale = false; S.phase = 'ready'; }
        bump();
      }, (e) => {
        pending.delete(name); clearTimeout(timer);
        if (e.code === 'revoked') { S.platformWrite = false; refreshRights(); }
        S.error = 'Archivio non raggiungibile: ' + (e.message || e.code); S.phase = 'ready'; bump();
      });
    });
  } catch (e) {
    S.phase = 'ready'; S.mode = 'snapshot'; S.error = ''; bump();
  }
}

const writeChains = {};
function put(coll, id, data) {
  if (!DB || !S.canWrite) return Promise.reject(new Error('Sola consultazione: accedi come staff per modificare.'));
  const key = coll + '/' + id;
  const body = JSON.parse(JSON.stringify(data));
  // aggiornamento ottimistico
  if (S[coll]) { S[coll] = { ...S[coll], [id]: body }; bump(); }
  const run = () => DB.doc(key).set(body).catch((e) => {
    if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 400 + Math.random() * 600)).then(() => DB.doc(key).set(body));
    throw e;
  });
  const p = (writeChains[key] || Promise.resolve()).then(run, run);
  writeChains[key] = p.catch(() => {});
  return p.then(() => markPub(coll)).catch((e) => { toast(errMsg(e), true); throw e; });
}
function del(coll, id) {
  if (!DB || !S.canWrite) return Promise.reject(new Error('Sola consultazione.'));
  if (S[coll]) { const c = { ...S[coll] }; delete c[id]; S[coll] = c; bump(); }
  return DB.doc(coll + '/' + id).delete().then(() => markPub(coll)).catch((e) => { toast(errMsg(e), true); throw e; });
}
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'permission-denied') return 'Salvataggio rifiutato: controlla di avere i permessi da staff.';
  if (c === 'quota_exceeded') return 'Archivio pieno: esporta un backup ed elimina sedute o note vecchie.';
  if (c === 'resource_exhausted') return 'Troppe modifiche ravvicinate: attendi qualche secondo e riprova.';
  return 'Non salvato: controlla la connessione e riprova.';
}

/* stats dai referti */
function playerStats() {
  const st = {};
  Object.values(S.players).forEach((p) => { st[p.id] = { played: 0, goals: 0, assists: 0, minutes: 0, yellow: 0, red: 0, mvp: 0, called: 0 }; });
  Object.values(S.matches).forEach((m) => {
    if (m.status !== 'played') return;
    const r = staffOf(m.id);
    (r.called || []).forEach((id) => { if (st[id]) st[id].called++; });
    Object.entries(r.report || {}).forEach(([id, v]) => {
      const s = st[id]; if (!s) return;
      if (v.played) s.played++;
      s.goals += +v.goals || 0; s.assists += +v.assists || 0; s.minutes += +v.minutes || 0; s.yellow += +v.yellow || 0; s.red += +v.red || 0;
    });
    if (r.mvp && st[r.mvp]) st[r.mvp].mvp++;
  });
  return st;
}

}

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();

/* grafico a linee/barre semplice */
function LineChart({ series, labels, max, height = 180 }) {
  const W = 600, H = height, P = { l: 30, r: 12, t: 12, b: 26 };
  const n = Math.max(1, labels.length);
  const top = max || Math.max(1, ...series.flatMap((s) => s.values.filter((v) => v != null)));
  const x = (i) => P.l + (n === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (n - 1));
  const y = (v) => H - P.b - (v / top) * (H - P.t - P.b);
  const ticks = [0, Math.round(top / 2), top];
  return html`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label=${series.map((s) => s.name).join(', ')}>
    ${ticks.map((t) => html`<g><line x1=${P.l} x2=${W - P.r} y1=${y(t)} y2=${y(t)} stroke="var(--line)" stroke-width="1"/><text x=${P.l - 6} y=${y(t) + 4} text-anchor="end">${t}</text></g>`)}
    ${labels.map((l, i) => (n <= 12 || i % Math.ceil(n / 10) === 0) && html`<text x=${x(i)} y=${H - 6} text-anchor="middle">${l}</text>`)}
    ${series.map((s) => { const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean); if (!pts.length) return null;
      return html`<g><polyline points=${pts.map((p) => p.join(',')).join(' ')} fill="none" stroke=${s.color} stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p, i) => html`<circle cx=${p[0]} cy=${p[1]} r=${i === pts.length - 1 ? 5 : 3.2} fill=${s.color}/>`)}</g>`; })}
  </svg>`;
}
/* radar per le valutazioni */
function Radar({ labels, sets, size = 260 }) {
  const c = size / 2, R = size / 2 - 46, n = labels.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * R * v / 5, c + Math.sin(a) * R * v / 5]; };
  return html`<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size + 40}px;margin:auto" role="img" aria-label=${'Radar: ' + labels.join(', ')}>
    ${[1, 2, 3, 4, 5].map((l) => html`<polygon points=${labels.map((_, i) => pt(i, l).join(',')).join(' ')} fill="none" stroke="var(--line)" stroke-width="1"/>`)}
    ${labels.map((lb, i) => { const [x, y] = pt(i, 6.1); return html`<text x=${x} y=${y} text-anchor="middle" dominant-baseline="middle" font-size="11">${lb.length > 14 ? lb.split(' ').slice(0, 2).join(' ') : lb}</text>`; })}
    ${sets.map((s) => html`<polygon points=${s.values.map((v, i) => pt(i, v || 0).join(',')).join(' ')} fill=${s.color} fill-opacity=".18" stroke=${s.color} stroke-width="2.5"/>`)}
  </svg>`;
}

/* graffi su canvas (hero, intro, live) */
function Stripes({ seed = 7, count = 14, alpha = .1 }) {
  const ref = useRef();
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const draw = () => {
      const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2); if (!r.width) return;
      cv.width = r.width * dpr; cv.height = r.height * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr);
      let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280; const tan = Math.tan(18 * Math.PI / 180);
      for (let i = 0; i < count; i++) {
        const x = (i / count) * r.width * 1.3 - r.width * .15 + rnd() * 30, len = r.height * (.35 + rnd() * .5), y0 = rnd() * r.height * .7 - len * .2, w = 9 + rnd() * 14;
        c.beginPath(); c.moveTo(x, y0); c.quadraticCurveTo(x + w * .9 + len * tan * .5, y0 + len * .5, x + len * tan, y0 + len); c.quadraticCurveTo(x + w * .2 + len * tan * .5, y0 + len * .45, x, y0);
        c.fillStyle = i % 4 === 0 ? `rgba(240,78,35,${alpha * 7})` : `rgba(255,255,255,${alpha})`; c.fill();
      }
    };
    draw(); const ro = new ResizeObserver(draw); ro.observe(cv); return () => ro.disconnect();
  }, []);
  return html`<canvas ref=${ref} aria-hidden="true"></canvas>`;
}

/* sincronizza sedute ↔ partite: una gara sostituisce l’allenamento dello stesso giorno */
async function syncTrainingWithMatches() {
  const byDate = {};
  Object.values(S.matches).forEach((m) => { if (m.date && m.status !== 'cancelled' && m.status !== 'postponed') byDate[m.date] = m.id; });
  for (const t of Object.values(S.training)) {
    const mid = byDate[t.date];
    if (mid && t.status !== 'replaced') await put('training', t.id, { ...t, status: 'replaced', replacedBy: mid });
    else if (!mid && t.status === 'replaced') await put('training', t.id, { ...t, status: 'planned', replacedBy: null });
  }
}

function CsvImport({ onClose }) {
  const [rows, setRows] = useState(null), [err, setErr] = useState('');
  const sample = 'data,ora,avversario,casa,campo,fase,giornata\n2027-05-06,21:00,Squadra esempio,si,Palestra Comunale Via Mazzini Sordio,Coppa,Quarti';
  const read = (file) => {
    if (!file) return; if (file.size > 2e6) { setErr('File troppo grande (massimo 2 MB).'); return; }
    const fr = new FileReader(); fr.onload = () => {
      const lines = String(fr.result).split(/\r?\n/).filter((l) => l.trim());
      const sep = lines[0].includes(';') ? ';' : ',';
      const head = lines[0].toLowerCase().split(sep).map((s) => s.trim());
      const ix = (k) => head.indexOf(k);
      if (ix('avversario') < 0) { setErr('Manca la colonna "avversario". Usa il modello.'); return; }
      const out = lines.slice(1, 501).map((l) => { const c = l.split(sep).map((s) => s.trim()); return { date: c[ix('data')] || '', time: c[ix('ora')] || '', opponent: c[ix('avversario')], home: /^(s|si|sì|1|casa|true)$/i.test(c[ix('casa')] || ''), venue: c[ix('campo')] || '', phase: c[ix('fase')] || 'Girone', round: c[ix('giornata')] || '' }; }).filter((r) => r.opponent);
      const bad = out.filter((r) => r.date && !/^\d{4}-\d{2}-\d{2}$/.test(r.date));
      if (bad.length) { setErr(`Date non valide in ${bad.length} righe: usa il formato AAAA-MM-GG.`); return; }
      setErr(''); setRows(out);
    }; fr.readAsText(file);
  };
  const imp = async () => { for (const r of rows) { const id = uid('m'); await put('matches', id, { ...r, id, status: r.date ? 'scheduled' : 'postponed' }); } await syncTrainingWithMatches(); toast(rows.length + ' partite importate'); onClose(); };
  return html`<${Modal} title="Importa il calendario" onClose=${onClose}>
    <p>1. Compila un file CSV con queste colonne (una riga per partita). Le partite esistenti non vengono sostituite.</p>
    <textarea class="copybox" readonly style="min-height:70px">${sample}</textarea>
    <div class="row"><button class="btn line sm" onClick=${() => saveFile('modello-calendario-quinto.csv', sample + '\n')}><${Icon} n="down"/>Scarica il modello</button></div>
    <${Field} label="2. Scegli il file e verifica" hint="Massimo 500 righe · 2 MB"><input type="file" accept=".csv,text/csv" onChange=${(e) => read(e.target.files[0])}/></${Field}>
    ${err && html`<div class="callout warn"><${Icon} n="info"/>${err}</div>`}
    ${rows && html`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Avversario</th><th>Campo</th></tr></thead><tbody>${rows.slice(0, 30).map((r) => html`<tr><td>${r.date || 'da definire'} ${r.time}</td><td>${r.opponent} ${r.home ? '(casa)' : ''}</td><td>${r.venue}</td></tr>`)}</tbody></table></div>
      <div><button class="btn fire" onClick=${imp}>Importa ${rows.length} partite</button></div>`}
  </${Modal}>`;
}

function useStaffMatch(m) {

/* ---------- AVVERSARI ---------- */
function teamProfile(name, ms) {
  const g = ms.filter((m) => m.hs != null && (m.home === name || m.away === name)).sort((a, b) => a.date.localeCompare(b.date));
  const rows = g.map((m) => { const home = m.home === name; const f = home ? m.hs : m.as, a = home ? m.as : m.hs; return { date: m.date, opponent: home ? m.away : m.home, gf: f, ga: a, r: f > a ? 'V' : f < a ? 'P' : 'N', pts: f > a ? 3 : f === a ? 1 : 0 }; });
  const n = rows.length; const ppg = n ? sum(rows.map((r) => r.pts)) / n : 0, gfp = n ? sum(rows.map((r) => r.gf)) / n : 0, gap = n ? sum(rows.map((r) => r.ga)) / n : 0;
  const last = rows.slice(-3); const form = last.length ? sum(last.map((r) => r.pts)) / last.length : 0;
  const index = n ? Math.max(0, Math.min(100, Math.round(ppg / 3 * 50 + Math.max(-3, Math.min(3, gfp - gap)) / 6 * 30 + 15 + form / 3 * 20 - 10))) : null;
  return { name, n, ppg, gfp, gap, form, index, rows };
}
function Avversari({ arg }) {
  useStore();
  const ms = leagueMatches();
  const teams = [...new Set(ms.flatMap((m) => [m.home, m.away]))].filter((t) => !isTigers(t)).sort();
  const us = teamProfile(TEAM_CSI, ms);
  const [sel, setSel] = useState(arg && teams.find((t) => t.toLowerCase() === String(arg).toLowerCase()) ? teams.find((t) => t.toLowerCase() === String(arg).toLowerCase()) : '');
  const all = sortBy(teams.map((t) => teamProfile(t, ms)), (p) => -(p.index ?? -1));
  const verdict = (p) => {
    if (p.index == null || us.index == null) return ['', 'Dati insufficienti'];
    const d = p.index - us.index; const rel = Math.min(p.n, us.n) >= 5 ? 'affidabilità media' : 'affidabilità bassa: poche gare';
    if (d >= 15) return ['bad', 'Più forte di noi · ' + rel]; if (d <= -15) return ['ok', 'Più debole di noi · ' + rel]; return ['warn', 'Alla pari · ' + rel];
  };
  const T = sel ? teamProfile(sel, ms) : null;
  const ours = sel ? matchList().filter((m) => m.opponent && sel.toLowerCase().includes(m.opponent.toLowerCase().split(' ')[0])) : [];
  const advice = (p) => {
    if (!p || p.index == null) return 'Analisi in attesa di risultati: nessuna valutazione viene inventata.';
    const a = [];
    if (p.gap >= 4) a.push('Concedono molto: cercate tiri presto e attaccate il secondo palo.');
    if (p.gfp >= 4.5) a.push('Segnano tanto: priorità a coperture e uscite coordinate, falli tattici solo se necessari.');
    if (p.form >= 2) a.push('Sono in forma: partite compatti nei primi 10 minuti.');
    if (p.form <= .7) a.push('Momento difficile per loro: pressione alta nei primi minuti può spezzarli.');
    if (!a.length) a.push('Squadra equilibrata: curate le transizioni e la gestione dei falli accumulati.');
    return a.join(' ');
  };
  return html`<div class="page">
    <${PageHead} eyebrow="Scouting del campionato" title="Conosci l’avversario." lead="Un confronto con i Tigers costruito sui risultati del girone. È una valutazione QUINTO, non un pronostico."/>

    ${T ? html`<div class="grid g2">
      <article class="card stack"><div class="card-h"><h3>${T.name}</h3><span class=${'pill ' + verdict(T)[0]}>${verdict(T)[1]}</span></div>
        <div class="tablewrap"><table><thead><tr><th>Per partita</th><th class="num">${short(T.name).split(' ')[0]}</th><th class="num">Tigers</th></tr></thead><tbody>
          <tr><td>Indice QUINTO (0–100)</td><td class="num"><b>${T.index ?? '—'}</b></td><td class="num"><b>${us.index ?? '—'}</b></td></tr>
          <tr><td>Punti</td><td class="num">${T.ppg.toFixed(2)}</td><td class="num">${us.ppg.toFixed(2)}</td></tr>
          <tr><td>Gol fatti</td><td class="num">${T.gfp.toFixed(1)}</td><td class="num">${us.gfp.toFixed(1)}</td></tr>
          <tr><td>Gol subiti</td><td class="num">${T.gap.toFixed(1)}</td><td class="num">${us.gap.toFixed(1)}</td></tr>
          <tr><td>Forma (punti ultime 3)</td><td class="num">${T.form.toFixed(1)}</td><td class="num">${us.form.toFixed(1)}</td></tr>
          <tr><td>Gare considerate</td><td class="num">${T.n}</td><td class="num">${us.n}</td></tr></tbody></table></div>
        <div class="callout"><${Icon} n="target"/><span><b>Indicazione di lavoro:</b> ${advice(T)}</span></div>
        ${ours.length ? html`<div class="small muted">Contro i Tigers: ${ours.map((m) => `${fmtDate(m.date)} ${m.home ? 'in casa' : 'fuori'}${m.status === 'played' ? ' ' + m.ourScore + '–' + m.theirScore : ''}`).join(' · ')}</div>` : null}
      </article>
      <article class="card stack"><span class="eyebrow">Risultati di ${short(T.name)}</span>
        ${T.rows.length ? html`<div class="list">${[...T.rows].reverse().map((r) => html`<div class="lrow"><span class=${'res ' + r.r}>${r.r}</span><div><div class="ttl">${short(r.opponent)}</div><div class="small muted">${fmtDate(r.date)}</div></div><span class="bigscore" style="font-size:22px">${r.gf}–${r.ga}</span></div>`)}</div>` : html`<p class="muted">Nessun risultato registrato.</p>`}
      </article></div>` : null}
    <div class="tablewrap"><table><thead><tr><th>Squadra</th><th class="num">Indice</th><th class="num">Pt/g</th><th class="num">GF/g</th><th class="num">GS/g</th><th>Forma</th><th>Rispetto a noi</th></tr></thead><tbody>
      <tr class="us"><td>Tigers</td><td class="num">${us.index ?? '—'}</td><td class="num">${us.ppg.toFixed(2)}</td><td class="num">${us.gfp.toFixed(1)}</td><td class="num">${us.gap.toFixed(1)}</td><td><div class="row" style="gap:3px;flex-wrap:nowrap">${us.rows.slice(-5).map((r) => html`<span class=${'res ' + r.r}>${r.r}</span>`)}</div></td><td>—</td></tr>
      ${all.map((p) => html`<tr style="cursor:pointer" onClick=${() => { setSel(p.name); scrollTo({ top: 0, behavior: 'smooth' }); }}><td>${p.name}</td><td class="num"><b>${p.index ?? '—'}</b></td><td class="num">${p.ppg.toFixed(2)}</td><td class="num">${p.gfp.toFixed(1)}</td><td class="num">${p.gap.toFixed(1)}</td><td><div class="row" style="gap:3px;flex-wrap:nowrap">${p.rows.slice(-5).map((r) => html`<span class=${'res ' + r.r}>${r.r}</span>`)}</div></td><td><span class=${'pill ' + verdict(p)[0]}>${verdict(p)[1].split(' · ')[0]}</span></td></tr>`)}

  </div>`;

/* ===== QUINTO · trailer della partita =====
   Presentazione a tutto schermo sincronizzata con l'audio (Suno). I tempi sono in trailers/<idPartita>.json.
   Ogni fotogramma legge audio.currentTime: la sincronia resta esatta anche su telefoni lenti. */

let TRAILER_INDEX = null;
async function loadTrailerIndex() {
  if (TRAILER_INDEX) return TRAILER_INDEX;
  try { const r = await fetch('trailers/index.json', { cache: 'no-cache' }); TRAILER_INDEX = r.ok ? await r.json() : {}; } catch (e) { TRAILER_INDEX = {}; }
  bump(); return TRAILER_INDEX;
}
function hasTrailer(id) { return !!(TRAILER_INDEX && TRAILER_INDEX[id]); }

/* scena corrente a partire dal tempo */
function trailerScene(d, t) {
  if (t < d.sections[0].t) return { kind: 'intro' };
  if (t >= d.peak) return { kind: 'peak' };
  if (t >= d.wave) return { kind: 'wave' };
  if (t >= d.drop) return { kind: 'drop' };
  if (t >= d.build) return { kind: 'build' };
  if (t >= d.chant[0]) return { kind: 'chant' };
  // persona o titolo di reparto, a seconda di cosa è iniziato per ultimo
  let person = -1; d.people.forEach((p, i) => { if (t >= p.tNum) person = i; });
  let sec = -1; d.sections.forEach((s, i) => { if (t >= s.t) sec = i; });
  const pT = person >= 0 ? d.people[person].tNum : -1;
  if (sec >= 0 && d.sections[sec].t > pT) return { kind: 'section', i: sec };
  return person >= 0 ? { kind: 'person', i: person } : { kind: 'intro' };
}

function Trailer({ id, onClose }) {
  const [d, setD] = useState(null), [err, setErr] = useState(''), [started, setStarted] = useState(false);
  const [scene, setScene] = useState({ kind: 'intro' }), [stage, setStage] = useState(0);
  const audio = useRef(), root = useRef(), raf = useRef();
  useEffect(() => { fetch(TRAILER_INDEX[id], { cache: 'no-cache' }).then((r) => r.json()).then(setD).catch(() => setErr('Trailer non disponibile: controlla la connessione.')); }, [id]);
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') close(); }; addEventListener('keydown', k); document.body.style.overflow = 'hidden'; return () => { removeEventListener('keydown', k); document.body.style.overflow = ''; cancelAnimationFrame(raf.current); }; }, []);
  const close = () => { try { audio.current && audio.current.pause(); } catch (e) {} cancelAnimationFrame(raf.current); onClose(); };
  const loop = () => {
    const a = audio.current; if (!a || !d) return;
    const t = window.__trailerT != null ? window.__trailerT : a.currentTime;
    const sc = trailerScene(d, t);
    // sotto-fasi della scena: numero → nome → cognome → nick
    let st = 0;
    if (sc.kind === 'person') { const p = d.people[sc.i]; st = t >= (p.tNick ?? 1e9) ? 3 : t >= p.tLast ? 2 : t >= p.tName ? 1 : 0; }
    if (sc.kind === 'intro') { const I = d.intro; st = t >= I.tigers ? 5 : t >= I.polisportiva ? 4 : t >= I.contro ? 3 : t >= I.opponent ? 2 : t >= I.giornata ? 1 : 0; }
    if (sc.kind === 'chant') st = d.chant.filter((c) => t >= c).length;
    if (sc.kind === 'drop' || sc.kind === 'wave' || sc.kind === 'peak') st = d.beats.filter((b) => b <= t).length;
    setScene((o) => (o.kind === sc.kind && o.i === sc.i ? o : sc)); setStage(st);
    // impulso sul ritmo nel drop: 1 sul battito, poi decade
    const el = root.current;
    if (el) {
      let pulse = 0;
      if (t >= d.drop) { let last = -1; for (const b of d.beats) { if (b <= t) last = b; else break; } if (last >= 0) pulse = Math.max(0, 1 - (t - last) / 0.3); }
      let bar = 0;
      if (t >= d.drop) { const bi = d.beats.filter((b) => b <= t).length - 1; if (bi >= 0 && bi % 4 === 0) bar = Math.max(0, 1 - (t - d.beats[bi]) / 0.45); }
      el.style.setProperty('--pulse', pulse.toFixed(3));
      el.style.setProperty('--bar', bar.toFixed(3));
      el.classList.toggle('dropping', t >= d.drop && t < d.outro);
      el.style.setProperty('--tension', Math.min(1, t / d.drop).toFixed(3));
      el.style.setProperty('--prog', Math.min(1, t / d.end).toFixed(4));
    }
    raf.current = requestAnimationFrame(loop);
  };
  const start = () => { const a = audio.current; if (!a) return; a.currentTime = 0; a.play().then(() => { setStarted(true); cancelAnimationFrame(raf.current); raf.current = requestAnimationFrame(loop); }).catch(() => setErr('Il browser ha bloccato l’audio: tocca di nuovo Play.')); };
  useEffect(() => { if (d && window.__trailerT != null) { setStarted(true); raf.current = requestAnimationFrame(loop); } }, [d]);
  const I = d && d.intro;
  return html`<div class="trailer" ref=${root} role="dialog" aria-label="Trailer della partita">
    <div class="tr-bg"><${Stripes} seed=${5} count=${20} alpha=${.06}/></div>
    <div class="tr-flash"></div>
    <button class="tr-close" aria-label="Chiudi il trailer" onClick=${close}><${Icon} n="x"/></button>
    ${d && html`<audio ref=${audio} src=${d.audio} preload="auto" onEnded=${close}></audio>`}
    ${err && html`<div class="tr-center"><p class="tr-err">${err}</p></div>`}
    ${!started && !err && html`<div class="tr-center tr-start">
        <div class="tr-disc"><img src="tigers-stemma.png" alt=""/></div>
        <span class="tr-kicker">${d ? d.round + ' · ' + (d.home ? 'Tigers – ' + d.opponent : d.opponent + ' – Tigers') : 'Carico il trailer…'}</span>
        <h2 class="tr-h">Trailer<br/><em>della partita</em></h2>
        <button class="btn fire tr-play" disabled=${!d} onClick=${start}><${Icon} n="play"/>Play · alza il volume</button></div>`}
    ${started && d && html`<div class="tr-stage">
      ${scene.kind === 'intro' && html`<div class="tr-center" key="intro">
        ${stage >= 0 && stage < 4 && html`<span class="tr-kicker tr-in" key="k">Signore e signori</span>`}
        ${stage >= 1 && stage < 4 && html`<span class="tr-sub tr-in" key="g">${d.round}</span>`}
        ${stage >= 2 && stage < 4 && html`<h2 class="tr-opp tr-slam" key="o">${d.opponent}</h2>`}
        ${stage >= 3 && stage < 4 && html`<span class="tr-vs tr-in" key="v">contro</span>`}
        ${stage >= 4 && html`<div class="tr-disc tr-spin" key="d"><img src="tigers-stemma.png" alt=""/></div><span class="tr-kicker tr-in" key="p">la Polisportiva</span>`}
        ${stage >= 5 && html`<h2 class="tr-mega tr-slam tr-shake" key="t">Tigers</h2>`}
      </div>`}
      ${scene.kind === 'section' && html`<div class="tr-center" key=${'s' + scene.i}><span class="tr-kicker tr-in">${d.round}</span><h2 class="tr-section tr-wipe">${d.sections[scene.i].label}</h2></div>`}
      ${scene.kind === 'person' && (() => { const p = d.people[scene.i]; const coach = isNaN(+p.num); return html`<div class="tr-person" key=${'p' + scene.i}>
        <span class=${'tr-num tr-slam' + (coach ? ' coach' : '')}>${p.num}</span>
        <div class="tr-who">
          <span class="tr-role tr-in">${p.role}</span>
          ${stage >= 1 && html`<span class="tr-first tr-in" key="f">${p.first}</span>`}
          ${stage >= 2 && html`<span class="tr-last tr-slam tr-shake" key="l">${p.last}</span>`}
          ${stage >= 3 && p.nick && html`<span class="tr-nick tr-pop" key="n"><span class="graffi"><i></i><i></i><i></i></span>${p.nick}!</span>`}
        </div>
        <div class="tr-count">${scene.i < 12 ? (scene.i + 1) + ' / 12' : 'Staff'}</div>
      </div>`; })()}
      ${scene.kind === 'chant' && html`<div class="tr-center" key="chant"><span class="tr-kicker">L’allenatore</span>${[0, 1, 2].map((k) => stage > k && html`<h2 class="tr-chant tr-slam" key=${k}>Davide!</h2>`)}</div>`}
      ${scene.kind === 'build' && html`<div class="tr-center" key="build"><div class="tr-ring"><div class="tr-ring-n">${d.people.slice(0, 12).map((p, k) => html`<span style=${`--a:${k * 30}deg`}>${p.num}</span>`)}</div><div class="tr-disc"><img src="tigers-stemma.png" alt=""/></div></div></div>`}
      ${(scene.kind === 'drop' || scene.kind === 'wave' || scene.kind === 'peak') && html`<${DropScene} d=${d} beat=${stage} kind=${scene.kind}/>`}
    </div><div class="tr-bar"><i></i></div>`}
  </div>`;
}

/* ---- il drop: fasi a tempo di musica (battito = stage) ---- */
const DROP_WORDS = ['Cinque in campo.', 'Tutti', 'dalla stessa parte.', 'Tigers!'];
function DropScene({ d, beat, kind }) {
  const squad = d.people.slice(0, 12);
  const b0 = d.beats.filter((b) => b < d.drop).length; // battiti prima del drop
  const k = Math.max(0, beat - b0); // battiti dal drop
  const tAt = (n) => d.beats[b0 + n] ?? d.end;
  const match = d.home ? ['Tigers', d.opponent] : [d.opponent, 'Tigers'];
  if (kind === 'peak') return html`<div class="tr-center" key="peak">
    <div class="tr-burst"></div>
    <div class="tr-disc tr-spin big"><img src="tigers-stemma.png" alt=""/></div>
    <h2 class="tr-h tr-slam">Una squadra.<br/><em>Una fede.</em></h2>
    <span class="tr-kicker tr-in">${d.round} · ${match[0]} – ${match[1]}</span></div>`;
  if (kind === 'wave') {
    // seconda ondata: la sfida, poi le parole del motto una per battuta (4 battiti)
    const w0 = d.beats.filter((b) => b < d.wave).length; const kw = Math.max(0, beat - w0);
    if (kw < 24) return html`<div class="tr-versus" key="vs">
      <div class="tr-vs-side l"><span class="tr-kicker">${d.home ? 'In casa' : 'Fuori casa'}</span><h2>${match[0]}</h2></div>
      <div class="tr-vs-x tr-beat">VS</div>
      <div class="tr-vs-side r"><h2>${match[1]}</h2><span class="tr-kicker">${d.round}</span></div></div>`;
    const word = DROP_WORDS[Math.floor((kw - 24) / 4) % DROP_WORDS.length];
    return html`<div class="tr-center" key=${'w' + Math.floor((kw - 24) / 4)}><h2 class=${'tr-word tr-slam' + (word === 'Tigers!' ? ' hot' : '')}>${word}</h2></div>`;
  }
  // fase 1 (16 battiti): il coro TIGERS, alternato pieno / contorno ogni 2 battiti
  if (k < 16) { const f = Math.floor(k / 2); return html`<div class="tr-center" key=${'c' + f}>
    <h2 class=${'tr-mega tr-slam' + (f % 2 ? ' outline solo' : '')}>Tigers!</h2>
    <div class="tr-marquee"><div>${[...squad, ...squad].map((p) => html`<span><b>${p.num}</b>${p.nick}</span>`)}</div></div></div>`; }
  // fase 2 (12 battiti): il muro della rosa, una tessera per battito
  if (k < 28) { const n = k - 15; return html`<div class="tr-center" key="wall"><span class="tr-kicker">La rosa · ${d.round}</span>
    <div class="tr-wall">${squad.map((p, i) => html`<div class=${'tr-tile' + (i < n ? ' on' : '')}><b>${p.num}</b><span>${p.nick}</span></div>`)}</div></div>`; }
  // fase 3: ogni giocatore a tutto schermo per 2 battiti, a colori alterni
  const i = Math.floor((k - 28) / 2) % 12, p = squad[i];
  return html`<div class=${'tr-strobe' + (i % 2 ? ' alt' : '')} key=${'s' + Math.floor((k - 28) / 2)}>
    <span class="tr-strobe-num">${p.num}</span>
    <div class="tr-strobe-txt"><span class="tr-first">${p.first} ${p.last}</span><h2 class="tr-strobe-nick tr-pop">${p.nick}!</h2></div></div>`;
}

/* generatore di formazioni */
const W_FIELD = { balanced: [1, 1, 1, 1, 1, 1], attack: [1.4, 1.5, .35, 1.1, .7, 1.6], defence: [.6, 1, 1.8, .7, 1.4, 1.1] };
const W_KEEP = { balanced: [1, 1, 1, 1, 1, 1], attack: [1, 1, 1, 1.5, 1.5, 1], defence: [1.4, 1.4, 1.3, .5, .5, 1.3] };
function pScores(pid, allowEst) { const r = ratingFor(pid); const l = latestScores(r); if (l) return { s: l.scores, rated: true }; return allowEst ? { s: [3, 3, 3, 3, 3, 3], rated: false } : null; }
function idx(sc, w) { return sum(sc.map((v, i) => v * w[i])) / sum(w); }
function combos(arr, k) { const out = []; const rec = (s, c) => { if (c.length === k) { out.push(c); return; } for (let i = s; i < arr.length; i++) rec(i + 1, [...c, arr[i]]); }; rec(0, []); return out; }
function Formazioni({ go }) {
  const [mode, setMode] = useState('match'), [style, setStyle] = useState('balanced'), [teams, setTeams] = useState(2), [est, setEst] = useState(true), [matchId, setMatchId] = useState((nextMatch() || {}).id || '');
  const all = playerList().filter((p) => !isUnavailable(p));
  const [sel, setSel] = useState(() => all.map((p) => p.id)); const [fixed, setFixed] = useState({});
  const [out, setOut] = useState(null);
  const run = () => {
    const ps = sel.map((id) => S.players[id]).filter(Boolean).map((p) => ({ p, k: p.role === 'Portiere', ...(pScores(p.id, est) || {}) })).filter((x) => x.s);
    if (mode === 'match') {
      const gks = ps.filter((x) => x.k), fs = ps.filter((x) => !x.k);
      if (!gks.length || fs.length < 4) { toast('Servono almeno un portiere e quattro giocatori di movimento valutati.', true); return; }
      const fixedIds = Object.keys(fixed).filter((id) => fixed[id] === 'in');
      const res = [];
      gks.forEach((g) => combos(fs, 4).forEach((c) => { const ids = [g, ...c].map((x) => x.p.id); if (fixedIds.some((id) => !ids.includes(id))) return; const roles = new Set(c.map((x) => x.p.role)); const cover = (roles.has('Pivot') ? .15 : 0) + (roles.has('Ultimo') ? .15 : 0) + (c.some((x) => x.p.foot === 'sinistro') ? .05 : 0); const score = idx(g.s, W_KEEP[style]) * .3 + avg(c.map((x) => idx(x.s, W_FIELD[style]))) * .7 + cover; res.push({ ids, score, est: [g, ...c].filter((x) => !x.rated).length }); }));
      setOut({ mode, list: sortBy(res, (r) => -r.score).slice(0, 3) });
    } else {
      const gks = ps.filter((x) => x.k), fs = sortBy(ps.filter((x) => !x.k), (x) => -idx(x.s, W_FIELD[style]));
      const T = Array.from({ length: teams }, () => []);
      Object.entries(fixed).forEach(([id, v]) => { if (v !== '' && v !== 'in' && !isNaN(+v)) { const x = fs.find((y) => y.p.id === id); if (x) { T[+v].push(x); } } });
      const free = fs.filter((x) => !T.flat().includes(x));
      free.forEach((x, i) => { const order = Math.floor(i / teams) % 2 ? [...Array(teams).keys()].reverse() : [...Array(teams).keys()]; const t = order[i % teams]; T[sortBy(order, (j) => T[j].length)[0] === t ? t : sortBy(order, (j) => T[j].length)[0]].push(x); });
      const mean = (t) => avg(t.map((x) => idx(x.s, W_FIELD[style])));
      for (let it = 0; it < 200; it++) { let best = null; const spread = () => Math.max(...T.map(mean)) - Math.min(...T.map(mean)); const cur = spread();
        for (let a = 0; a < teams; a++) for (let b = a + 1; b < teams; b++) T[a].forEach((x, i) => T[b].forEach((y, j) => { if (fixed[x.p.id] || fixed[y.p.id]) return; [T[a][i], T[b][j]] = [y, x]; const s = spread(); if (s < cur - 1e-6 && (!best || s < best.s)) best = { a, b, i, j, s }; [T[a][i], T[b][j]] = [x, y]; }));
        if (!best) break; const x = T[best.a][best.i]; T[best.a][best.i] = T[best.b][best.j]; T[best.b][best.j] = x; }
      gks.forEach((g, i) => T[i % teams].push(g));
      setOut({ mode, teams: T.map((t) => ({ ids: t.map((x) => x.p.id), mean: mean(t.filter((x) => !x.k)) })), spread: Math.max(...T.map((t) => mean(t.filter((x) => !x.k)))) - Math.min(...T.map((t) => mean(t.filter((x) => !x.k)))), noGk: !gks.length });
    }
  };
  const apply = async (ids) => { if (!matchId) { toast('Scegli una gara sopra.', true); return; } const r = { availability: {}, called: [], starters: [], formation: '1-2-1', report: {}, ...clone(staffOf(matchId)) }; const called = [...new Set([...(r.called || []), ...ids])]; if (called.length > MAX_CALLED) { toast(`Superati i ${MAX_CALLED} convocati: libera prima un posto nel Centro partita.`, true); return; } r.called = called; r.starters = ids; await put('staffmatches', matchId, r); toast('Quintetto applicato alla gara'); go('partita', matchId); };
  if (!S.canWrite) return html`<${Empty} title="Riservato allo staff">Il generatore usa le valutazioni riservate di Davide.</${Empty}>`;
  return html`<div class="grid g-7-5" style="align-items:start">
    <article class="card form">
      <span class="eyebrow">Trova il quintetto · bilancia le squadre</span>
      <${Seg} value=${mode} onChange=${(v) => { setMode(v); setOut(null); }} options=${[['match', 'Quintetto partita'], ['training', 'Squadre allenamento']]}/>
      <div class="fgrid"><${Field} label="Impostazione"><select value=${style} onChange=${(e) => setStyle(e.target.value)}><option value="balanced">Equilibrata</option><option value="attack">Offensiva</option><option value="defence">Difensiva</option></select></${Field}>
        ${mode === 'match' ? html`<${Field} label="Gara da preparare (facoltativa)"><select value=${matchId} onChange=${(e) => setMatchId(e.target.value)}><option value="">Prova libera</option>${matchList().filter((m) => m.status === 'scheduled').map((m) => html`<option value=${m.id}>${fmtDate(m.date)} · ${m.opponent}</option>`)}</select></${Field}>`
        : html`<${Field} label="Squadre da creare"><select value=${teams} onChange=${(e) => setTeams(+e.target.value)}><option value="2">2 squadre · cambi se necessari</option><option value="3">3 squadre · due giocano, una ruota</option></select></${Field}>`}</div>
      <div class="stack" style="gap:2px"><span class="field"><span>${sel.length} giocatori selezionati</span></span>
        ${all.map((p) => html`<div class="arow" style="grid-template-columns:minmax(0,1fr) auto"><label class="check"><input type="checkbox" checked=${sel.includes(p.id)} onChange=${(e) => setSel(e.target.checked ? [...sel, p.id] : sel.filter((x) => x !== p.id))}/>${pFull(p)} <span class="small muted">${p.role || ''}${ratingFor(p.id) ? '' : ' · senza valutazione'}</span></label>
          <select aria-label=${'Vincolo per ' + pName(p)} value=${fixed[p.id] || ''} onChange=${(e) => setFixed({ ...fixed, [p.id]: e.target.value })} style="width:auto">${mode === 'match' ? html`<option value="">Libero</option><option value="in">Fisso nel quintetto</option>` : html`<option value="">Assegnazione automatica</option>${Array.from({ length: teams }, (_, i) => html`<option value=${i}>Fissa in squadra ${String.fromCharCode(65 + i)}</option>`)}`}</select></div>`)}</div>
      <label class="check small"><input type="checkbox" checked=${est} onChange=${(e) => setEst(e.target.checked)}/>Consenti stime neutre 3/5 per chi non ha valutazioni (sempre segnalate)</label>
      <div><button class="btn fire" onClick=${run}><${Icon} n="wand"/>Proponi</button></div>
      <details class="drill"><summary><${Icon} n="info"/><b>Come viene costruita la proposta</b><span></span></summary><div class="modal-b small"><p>Equilibrata considera tutte le sei capacità. Offensiva dà più peso a tecnica, visione e gioco senza palla (per i portieri: piedi e distribuzione). Difensiva privilegia difesa e resistenza (per i portieri: parate, posizione e uscite). La presenza di un ultimo, di un pivot e di un mancino aggiunge un piccolo bonus di copertura dei ruoli.</p><p>In allenamento il motore crea gruppi di dimensioni simili e li migliora con scambi, rispettando i vincoli. Gli indici non sono probabilità di vittoria; età e note personali non contano. Nessuna convocazione cambia finché non premi “Usa quintetto per la gara”.</p></div></details>
    </article>
    <article class="card stack">
      <span class="eyebrow">Le alternative per Davide</span>
      ${!out ? html`<p class="muted">Scegli impostazione e giocatori, poi premi Proponi.</p>` : out.mode === 'match' ? out.list.map((r, i) => html`<div class="card flat stack" style="padding:14px"><div class="row between"><b>Proposta ${i + 1}</b><span class="pill fire">Indice ${r.score.toFixed(2)}</span></div>
        <div class="onfield">${r.ids.map((id) => html`<span class=${'pill ' + (S.players[id].role === 'Portiere' ? 'warn' : 'blue')}>${pName(S.players[id])}</span>`)}</div>${r.est ? html`<span class="small muted">${r.est} giocator${r.est === 1 ? 'e' : 'i'} con stima neutra 3/5</span>` : null}
        <div class="row"><button class="btn line sm" disabled=${!matchId} onClick=${() => apply(r.ids)}>Usa quintetto per la gara</button></div></div>`)
      : html`${out.teams.map((t, i) => html`<div class="card flat stack" style="padding:14px"><div class="row between"><b>Squadra ${String.fromCharCode(65 + i)}</b><span class="pill">Indice medio ${t.mean.toFixed(2)}</span></div><div class="onfield">${t.ids.map((id) => html`<span class=${'pill ' + (S.players[id].role === 'Portiere' ? 'warn' : 'blue')}>${pName(S.players[id])}</span>`)}</div></div>`)}

    </article>
  </div>`;

        </article>
        <article class="card stack"><span class="eyebrow">Il tuo archivio</span><p class="small">Scarica una copia completa di rosa, partite, referti, note, classifica, allenamenti, schemi e valutazioni. Il ripristino accetta anche il backup JSON della vecchia app QUINTO.</p>
          <div class="row"><button class="btn line" onClick=${exportAll}><${Icon} n="down"/>Esporta backup</button>${S.canWrite && html`<button class="btn line" onClick=${() => setRestore(true)}><${Icon} n="up"/>Ripristina / importa</button>`}</div></article>
        <article class="card stack"><span class="eyebrow">Le vostre fonti</span><div class="list">

          <a class="lrow" style="text-decoration:none;color:inherit;grid-template-columns:auto 1fr auto" href=${CSI_LEAGUE} target="_blank" rel="noopener"><${Icon} n="ext"/><span>Pagina del campionato · CSI</span><span></span></a>
